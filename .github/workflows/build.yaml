name: EAS Build (Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: preview (APK для теста) или production (AAB для стора)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --json > build.json

          URL=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          ID=$(jq -r '.[0].id // empty' build.json)
          echo "artifact-url=$URL" >> "$GITHUB_OUTPUT"
          echo "build-id=$ID"     >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always() && steps.build.outputs.artifact-url != ''
        run: |
          echo "### EAS Build ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build ID: \`${{ steps.build.outputs.build-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: ${{ steps.build.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Раздай ссылку тестировщикам — они скачают APK и установят вручную." >> $GITHUB_STEP_SUMMARY